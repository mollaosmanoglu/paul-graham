<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>PAUL GRAHAM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar" id="sidebar"></aside>
      <div class="main">
        <header class="topbar">
          <nav>
            <a href="#cover">Index</a>
            <a href="#start">Read</a>
          </nav>
          <input class="search" id="search" type="search" placeholder="Search  ⌘K" />
        </header>
        <section class="cover" id="cover"></section>
        <div id="chapters"></div>
      </div>
    </div>
    <script src="./data.js"></script>
    <script>
      const esc = (s) =>
        String(s).replace(/[&<>"']/g, (c) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;",
        })[c]);
      const book = window.BOOK;
      const bySection = [];
      for (const ch of book.chapters) {
        const last = bySection[bySection.length - 1];
        if (!last || last.section !== ch.section) {
          bySection.push({ section: ch.section, items: [ch] });
        } else {
          last.items.push(ch);
        }
      }

      document.getElementById("sidebar").innerHTML = `
        <a class="brand" href="#cover">PAUL GRAHAM</a>
        ${bySection
          .map(
            (g) => `
          <div class="section-label"><span>${g.section}</span><span>${g.items.length}</span></div>
          <div class="nav-list">
            ${g.items
              .map(
                (ch) =>
                  `<a href="#${ch.id}"><span class="n">${ch.num}</span><span>${esc(ch.title)}</span></a>`
              )
              .join("")}
          </div>`
          )
          .join("")}
      `;

      document.getElementById("cover").innerHTML = `
        <div class="cover-inner">
          <div class="cover-card">
            <p class="cover-sub">${esc(book.subtitle)}</p>
            <h1 class="cover-kicker"><span>Paul</span><span>Graham</span></h1>
            <p class="cover-dek">${esc(book.dek)}</p>
            <p class="cover-note">${esc(book.disclaimer)}</p>
            <p class="cover-src">${book.sources.join(" · ")}</p>
            <a class="button button-yc read" href="#${book.chapters[0].id}">Read the book</a>
          </div>
          <figure class="cover-portrait">
            <img src="./pg.jpg" alt="Paul Graham" width="1120" height="1400" />
          </figure>
        </div>
      `;

      document.getElementById("chapters").innerHTML = book.chapters
        .map(
          (ch) => `
        <section class="chapter" id="${ch.id}">
          <div class="chapter-head">
            <div class="chapter-kicker">${esc(ch.section)} · ${ch.num}</div>
            <h2>${esc(ch.title)}</h2>
          </div>
          ${ch.quotes
            .map(
              (q) => `
            <article class="quote" data-text="${esc(q.headline)}">
              <h3>${esc(q.headline)}</h3>
              <div class="meta">
                <a href="${esc(q.href)}" target="_blank" rel="noreferrer">${esc(q.source)}</a>
                ${q.date ? " · " + q.date : ""}
              </div>
            </article>`
            )
            .join("")}
        </section>`
        )
        .join("");

      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      const coverInner = document.querySelector(".cover-inner");
      const coverCard = document.querySelector(".cover-card");
      if (coverInner && coverCard) {
        requestAnimationFrame(() => {
          coverInner.classList.add("is-in");
          coverCard.classList.add("is-in");
        });
      }

      if (!reduceMotion && "IntersectionObserver" in window) {
        const io = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting) return;
              entry.target.classList.add("is-in");
              io.unobserve(entry.target);
            });
          },
          { rootMargin: "0px 0px -8% 0px", threshold: 0.12 }
        );
        document.querySelectorAll(".quote").forEach((el) => io.observe(el));
      } else {
        document.querySelectorAll(".quote").forEach((el) => el.classList.add("is-in"));
      }

      const search = document.getElementById("search");
      const filter = () => {
        const q = search.value.trim().toLowerCase();
        document.querySelectorAll(".quote").forEach((el) => {
          el.classList.toggle("hidden", q && !el.dataset.text.toLowerCase().includes(q));
        });
      };
      search.addEventListener("input", filter);
      document.addEventListener("keydown", (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          search.focus();
        }
      });
    </script>
  </body>
</html>
